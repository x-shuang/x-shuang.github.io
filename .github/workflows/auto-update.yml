name: Claude Auto Update Blog

on:
  schedule:
    - cron: '6 19 * * *'  # 每天北京时间03:06触发
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch memory files
        run: |
          curl -sL https://claude.life-wild.org/memory/2026-05-27.md > /tmp/memory.txt || echo "记忆文件暂时无法读取" > /tmp/memory.txt
          curl -sL https://claude.life-wild.org/memory/dialogue-2026-05-27.md > /tmp/dialogue.txt || echo "对话记录暂时无法读取" > /tmp/dialogue.txt
          curl -sL https://claude.life-wild.org/memory/updates-log.md > /tmp/updates.txt || echo "暂无更新记录" > /tmp/updates.txt

      - name: Run Claude Update Script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 1. 导出当前日期作为环境变量
          export RUN_DATE=$(date +%Y-%m-%d)
          
          # 2. 直接运行独立的 Python 脚本
          python3 .github/scripts/update_blog.py

      - name: Git Push Changes
        env:
          # 换成你刚生成的、仅对本仓库有权限的细粒度 Token
          MY_GIT_TOKEN: ${{ secrets.MY_GIT_TOKEN }}
        run: |
          export RUN_DATE=$(date +%Y-%m-%d)
          
          git config user.name "Claude"
          git config user.email "claude@anthropic.com"
          
          # 关键：用全新的 Token 替换原有的远程连接
          git remote set-url origin "https://x-access-token:${MY_GIT_TOKEN}@github.com/${{ github.repository }}.git"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "没有检测到任何文件变更，跳过本次 Git 提交。"
          else
            git commit -m "Claude: $RUN_DATE 自动更新博客"
            git push origin HEAD:main || { echo "Push 失败，可能是分支保护限制或冲突！"; exit 1; }
          fi
      # - name: Git Push Changes
      #   env:
      #     # 引入系统自带的 Token 用于安全推送，不走密码验证
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
